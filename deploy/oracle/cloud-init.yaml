#cloud-config
package_update: true
packages: [curl, ca-certificates]
users:
  - name: meshai
    system: true
    shell: /usr/sbin/nologin
write_files:
  - path: /etc/systemd/system/meshd-mirror.service
    permissions: "0644"
    content: |
      [Unit]
      Description=MeshAI admin mirror (read-only)
      After=network-online.target
      Wants=network-online.target
      [Service]
      User=meshai
      EnvironmentFile=/etc/meshai/mirror.env
      ExecStart=/opt/meshai/meshd --state-dir /var/lib/meshai mirror --api-port 8080 --token ${MESHAI_MIRROR_TOKEN}
      Restart=always
      RestartSec=2
      [Install]
      WantedBy=multi-user.target
runcmd:
  - mkdir -p /opt/meshai /etc/meshai /var/lib/meshai
  - chown meshai:meshai /var/lib/meshai
  - iptables -I INPUT -p tcp --dport 8080 -j ACCEPT
  - netfilter-persistent save || true
